services:
  notifier:
    build: .
    container_name: codebridge-notifier
    restart: unless-stopped
    network_mode: host  # Access RTSP cameras on local network
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./snapshots:/app/snapshots
    # GPU passthrough (comment out if no NVIDIA GPU)
