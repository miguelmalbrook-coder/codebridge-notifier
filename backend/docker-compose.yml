services:
  notifier:
    build: .
    container_name: codebridge-notifier
    restart: unless-stopped
    network_mode: host  # Access RTSP cameras on local network
    env_file:
      - .env
    environment:
      - TZ=Asia/Muscat
    volumes:
      - ./data:/app/data
      - ./snapshots:/app/snapshots
      - ./app-release.apk:/app/app-release.apk

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: codebridge-ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "8090:80"
    volumes:
      - ./ntfy-cache:/var/cache/ntfy
      - ./ntfy-etc:/etc/ntfy
    environment:
      - NTFY_BASE_URL=https://situated-com-minerals-burns.trycloudflare.com
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_BEHIND_PROXY=true

  # Cloudflare quick tunnel — URL auto-updated in Supabase by tunnel-watchdog
  cloudflared-api:
    image: cloudflare/cloudflared:latest
    container_name: codebridge-cloudflared-api
    restart: unless-stopped
    command: tunnel --url http://host.docker.internal:8001
    depends_on:
      - notifier
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Cloudflare quick tunnel — exposes ntfy on port 8090 over the internet
  cloudflared-ntfy:
    image: cloudflare/cloudflared:latest
    container_name: codebridge-cloudflared-ntfy
    restart: unless-stopped
    command: tunnel --url http://host.docker.internal:8090
    depends_on:
      - ntfy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Tunnel watchdog — auto-updates tunnel URLs in Supabase app_config
  tunnel-watchdog:
    build:
      dockerfile: Dockerfile.watchdog
    container_name: codebridge-watchdog
    restart: unless-stopped
    depends_on:
      - cloudflared-api
      - cloudflared-ntfy
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - API_TUNNEL_NAME=codebridge-cloudflared-api
      - NTFY_TUNNEL_NAME=codebridge-cloudflared-ntfy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
